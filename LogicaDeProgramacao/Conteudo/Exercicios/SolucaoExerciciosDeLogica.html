        // 1.3 - Número par ou ímpar
        const numero = Number(prompt("1.3 Digite um número: "));
        
        if (numero % 2 === 0) {
            console.log("O número " + numero + " é par.");

        }

        // 1.4 - Maior número
        const firstMaior = Number(prompt("1.4 Digite um número: "));
        const secondMaior = Number(prompt("1.4 Digite um número: "));
        const max = Math.max(firstMaior, secondMaior);
        console.log("O maior número entre " + firstMaior + " e " + secondMaior + " é " + max);

        // 2
        const Numero1 = Number(prompt("2. Digite um número: "));        
        if(Numero1 > 0){
            console.log("O número " + Numero1 + " é positivo.");
        } else if(Numero1 < 0){
            console.log("O número " + Numero1 + " é negativo.");
        } else {
