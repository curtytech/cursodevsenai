<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css" />
</head>

<body>
    
    <div class="flex justify-center mt-5">

    <div class=" border border-gray-400 p-4 w-80 rounded-lg  ">
        <h1 class="text-2xl text-center mt-5 font-bold animate-pulse text-blue-700"><i class="ph-bold ph-list-checks"></i>
            Lista de Tarefas <i class="ph-bold ph-list-checks"></i></h1>
        <div class="flex flex-col mt-5 w-full justify-center items-center ">

            <div class="flex gap-5">

                <!-- <label for="tarefa">Tarefa</label> -->
                <input placeholder="Tarefa" type="text" name="tarefa" id="tarefa" value="test"
                    class="rounded-lg border border-gray-500 text-black p-1">

                <!-- <label for="status">Status</label> -->
                <!-- <input type="checkbox" name="status" id="status"
                    class="w-6 rounded-lg border border-gray-500 text-black p-1"> -->
            </div>

            <button class="btn bg-blue-700 text-white p-3 rounded-lg mt-5" id="enviar">Enviar</button>
        </div>
    </div>
    </div>

    <div class="flex justify-center">
        <div id="listaDeDados" class="flex flex-col gap-5 mt-5 mx-5 w-64 justify-center items-center">

        </div>
    </div>

    <script>
        let tarefa = "Phelipe";
        let status = true;
        let btnNumber = 1

        document.getElementById("enviar").addEventListener("click", mostarDados);

        function mostarDados() {
            let tarefa = document.getElementById("tarefa").value;
            // let status = document.getElementById("status").value;



            let listaDeDados = document.getElementById("listaDeDados");

            listaDeDados.innerHTML += `
            <div class="flex justify-between items-center w-64 border p-2 border-gray-400 rounded-lg">
            
                <span class="text-blue-500">
                    ${tarefa}
                </span>

                <button 
                    id="btnStatus${btnNumber}"  
                    class="btn bg-blue-700 text-white p-2 rounded btnStatus">                        
                    <i class="ph-bold ph-check-circle "></i>
                </button>
            </div>
            `;

            btnNumber++;
        }

        // Captura cliques nos elementos criados dentro de listaDeDados
        document.getElementById("listaDeDados").addEventListener("click", function (event) {

            if (event.target.classList.contains("btnStatus")) {
                updateStatus(event.target);
            }

        });

        function updateStatus(elemento) {
            console.log("click")
            const statusAtual = elemento.dataset.status === "true";
            const novoStatus = !statusAtual;

            elemento.dataset.status = novoStatus;
            elemento.innerHTML = novoStatus ? `<i class="ph-bold ph-check-circle"></i>` : `<i class="ph-bold ph-circle"></i>`;

            console.log("Status:", novoStatus);
        }
        // document.getElementById("myBtn").addEventListener("click", displayDate);

        // function displayDate() {
        //     document.getElementById("demo").innerHTML = Date();
        // }



    </script>



</body>

</html>
