<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <div class="flex justify-center">
        <h1 class="text-blue-500 text-2xl font-bold mt-5 animate-pulse">Meu Desafio!</h1>
    </div>

    <div class="flex flex-row justify-center mx-5 mt-5 ">
        <p class="text-center text-lg w-[800px]">Lorem ipsum dolor sit amet consectetur adipisicing elit. Modi
            aspernatur repellat exercitationem
            totam cupiditate
            perferendis, enim consequuntur ipsam dolore sint unde sunt voluptatem officia inventore error illo veritatis
            qui
            animi.</p>
    </div>
    <br>
    <div class="flex justify-center mt-3">
        <span> Span <b class="text-red-700"> Negrito </b></span>
    </div>
    <div class="flex justify-center mt-3">
        <span> Span <i class="text-blue-700">Italico </i></span>
    </div>

    <br>
    <hr>



    <div class="grid grid-cols-6 gap-2 mx-3">
        <div class="col-span-2 animate-pulse">
            <a target="_blank" class="mt-4" href="https://www.firjan.com.br/senai/">
            <img class="mt-4" title="Para mais informações acesse"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkA2wTI52B6m7o4P4ceoxweZuvPN4dY9UdSa0iB63jwA&s=10"
                alt="">
            </a>
        </div>

        <form action="" class="col-span-4 mt-5 justify-center">
            <div class="justify-between mx-4">
                <p class="w-full text-center bg-purple-700 rounded-lg text-white font-bold p-3">Preencha o Formulário</p>
                <div class=" w-full  mt-3">
                    <input class="w-full border rounded-lg  flex items-center rounded-md bg-white pl-3" type="text" name=""
                        placeholder="Nome" id="">
                </div>
                <div class=" w-full  mt-3">

                    <input class="w-full border rounded-lg  flex items-center rounded-md bg-white pl-3" type="password" name=""
                        placeholder="Password" id="">
                </div>
                <div class=" w-full  mt-3">

                    <input class="w-full border rounded-lg  flex items-center rounded-md bg-white pl-3" type="email"
                        name="email" placeholder="Email" id="email">
                </div>
                <div class=" w-full  mt-3">
                    <input class="w-full border rounded-lg  flex items-center rounded-md bg-white pl-3" type="date" name=""
                        placeholder="Data de Nascimento" id="data">
                </div>
                <div class="flex justify-center mt-4">
                    <button class="mx-5 w-full bg-purple-700 text-white p-2 rounded-lg hover:bg-blue-500"> Enviar</button>
                </div>
            </div>
        </form>

    </div>

    <br>


</body>

</html>
