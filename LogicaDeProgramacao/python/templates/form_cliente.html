<div class="container mt-5">
    <form class="c-form" c-append="#lista-clientes"
        {% if cliente %}
            action="{{ url_for('cliente.atualizar_cliente', cliente_id=cliente.id) }}"
        {% else %}
            action="{{ url_for('cliente.inserir_cliente') }}"
        {% endif %}

        {% if cliente %}
            method="PUT"
        {% else %}
            method="POST"
        {% endif %}
        >
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" name="nome">
        </div>
        
        <div class="mb-3">
            <label id="label-target" for="email" class="form-label">Email</label>
            <input type="text" class="form-control" id="email" name="email">
        </div>
        
        <button type="submit" class="btn btn-primary">Submit</button>
        
    </form> 
</div>
