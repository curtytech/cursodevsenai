<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App Vue One.js</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Vue.js -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div id="app" class="relative isolate flex min-h-screen items-center justify-center overflow-hidden px-6 py-12">
    <div
      class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top_right,_rgba(20,184,166,0.18),_transparent_38%),radial-gradient(circle_at_bottom_left,_rgba(14,165,233,0.14),_transparent_42%)]">
    </div>
    <div
      class="absolute inset-0 -z-10 opacity-20 [background-image:linear-gradient(rgba(148,163,184,0.12)_1px,transparent_1px),linear-gradient(90deg,rgba(148,163,184,0.12)_1px,transparent_1px)] [background-size:42px_42px]">
    </div>

    <main class="w-full max-w-md">
      <section
        class="overflow-hidden rounded-3xl border border-white/10 bg-slate-900/80 shadow-2xl shadow-cyan-950/40 backdrop-blur-xl">
        <div class="border-b border-white/10 px-8 pb-7 pt-8 sm:px-10 animate animate-pulse">
          <div class="mb-10 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span
                class="flex h-10 w-10 items-center justify-center rounded-xl bg-cyan-400/10 text-cyan-300 ring-1 ring-inset ring-cyan-300/20">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 6v6l4 2m5-2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
              </span>
              <span class="text-sm font-semibold tracking-wide text-slate-300">Vue CEP</span>
            </div>
            <span class="flex items-center gap-2 text-xs font-medium text-emerald-300">
              <span class="h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.9)]"></span>
              Online
            </span>
          </div>

          <p class="mb-3 text-sm font-medium uppercase tracking-[0.2em] text-cyan-300">Experimento 04</p>
          <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">{{ mensagem }}</h1>
        </div>

        <div class="px-8 py-8 sm:px-10 sm:py-10">                   

          <div v-if="resultado" class="rounded-2xl border border-white/10 bg-slate-950/60 p-6 text-center">
            <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Resultado</p>
            <ul class="mt-4 space-y-2 text-left text-sm text-white">
              <li v-for="aluno in resultado" :key="aluno.id" class="rounded-lg bg-slate-800 px-4 py-3">
                {{ aluno.nome }} - {{ aluno.idade }} anos
              </li>
            </ul>

          </div>


        </div>
      </section>

      <p class="mt-6 text-center text-xs text-slate-500">Construído para aprender. Feito para experimentar.</p>
    </main>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
      setup() {
        const mensagem = ref("Cosumindo Python com Vue.js!");
        const contador = ref(0);
        const cep = ref("");
        const resultado = ref([]);

        async function buscarAlunos() {
          try {
            const resposta = await fetch(`http://127.0.0.1:5000/alunos`, {
              method: "GET"
            });

            if (!resposta.ok) {
              throw new Error(`Erro ao carregar alunos: ${resposta.status}`);
            }

            resultado.value = await resposta.json();

          } catch (erro) {
            console.error("Não foi possível carregar os alunos:", erro);

          } finally {
            console.log("Busca de alunos finalizada.");
          }
        }

        onMounted(buscarAlunos);

        return {
          mensagem,
          contador,
          cep,
          buscarAlunos,
          resultado
        };
      }
    }).mount("#app");
  </script>
</body>

</html>
