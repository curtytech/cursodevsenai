<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App Vue One.js</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Vue.js -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div id="app" class="relative isolate flex min-h-screen items-center justify-center overflow-hidden px-6 py-12">
    <div class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top_right,_rgba(20,184,166,0.18),_transparent_38%),radial-gradient(circle_at_bottom_left,_rgba(14,165,233,0.14),_transparent_42%)]"></div>
    <div class="absolute inset-0 -z-10 opacity-20 [background-image:linear-gradient(rgba(148,163,184,0.12)_1px,transparent_1px),linear-gradient(90deg,rgba(148,163,184,0.12)_1px,transparent_1px)] [background-size:42px_42px]"></div>

    <main class="w-full max-w-md">
      <section class="overflow-hidden rounded-3xl border border-white/10 bg-slate-900/80 shadow-2xl shadow-cyan-950/40 backdrop-blur-xl">
        <div class="border-b border-white/10 px-8 pb-7 pt-8 sm:px-10">
          <div class="mb-10 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-cyan-400/10 text-cyan-300 ring-1 ring-inset ring-cyan-300/20">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m5-2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
              </span>
              <span class="text-sm font-semibold tracking-wide text-slate-300">Vue playground</span>
            </div>
            <span class="flex items-center gap-2 text-xs font-medium text-emerald-300">
              <span class="h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.9)]"></span>
              Online
            </span>
          </div>

          <p class="mb-3 text-sm font-medium uppercase tracking-[0.2em] text-cyan-300">Experimento 01</p>
          <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">{{ mensagem }}</h1>
          <p class="mt-3 max-w-xs text-sm leading-6 text-slate-400">Um pequeno espaço para testar reatividade e dar vida às suas ideias.</p>
        </div>

        <div class="px-8 py-8 sm:px-10 sm:py-10">
          <div class="mb-8 rounded-2xl border border-white/10 bg-slate-950/60 p-6 text-center">
            <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Contador atual</p>
            <p class="mt-3 text-7xl font-bold tabular-nums tracking-tight text-white">{{ contador }}</p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <button @click="incrementar" class="group flex items-center justify-center gap-2 rounded-2xl bg-cyan-400 px-4 py-3 text-sm font-bold text-slate-950 shadow-lg shadow-cyan-950/40 transition duration-200 hover:-translate-y-0.5 hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-300 focus:ring-offset-2 focus:ring-offset-slate-900 active:translate-y-0">
              <span>+1</span>
            </button>

            <button @click="decrementar" class="group flex items-center justify-center gap-2 rounded-2xl border border-white/10 bg-slate-800 px-4 py-3 text-sm font-bold text-white transition duration-200 hover:-translate-y-0.5 hover:border-cyan-400/60 hover:text-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-300 focus:ring-offset-2 focus:ring-offset-slate-900 active:translate-y-0">
              <span>-1</span>
            </button>
          </div>

          <button @click="resetar" class="mt-3 flex w-full items-center justify-center gap-3 rounded-2xl border border-white/10 bg-slate-800 px-5 py-3 text-sm font-semibold text-slate-200 transition duration-200 hover:border-rose-400/60 hover:text-rose-300 focus:outline-none focus:ring-2 focus:ring-rose-300 focus:ring-offset-2 focus:ring-offset-slate-900">
            <span>Resetar</span>
          </button>

          <div class="mt-6 rounded-2xl border border-white/10 bg-slate-950/60 p-4">
            <label for="campo-tecla" class="mb-2 block text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-400">Teclado</label>
            <input
              id="campo-tecla"
              type="text"
              placeholder="Pressione Enter, Espaço ou setas"
              class="w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:border-cyan-300 focus:outline-none"
              @keydown.enter.prevent="incrementar"
              @keydown.space.prevent="alternarEstado"
              @keydown.up.prevent="incrementar"
              @keydown.down.prevent="decrementar"
              @keydown="atualizarUltimaTecla"
            >
            <p class="mt-3 text-sm text-cyan-300">Última tecla: {{ ultimaTecla }}</p>
          </div>
        </div>
      </section>

      <p class="mt-6 text-center text-xs text-slate-500">Construído para aprender. Feito para experimentar.</p>
    </main>
  </div>

  <script>
    const { createApp, ref, onMounted, onBeforeUnmount } = Vue;

    createApp({
      setup() {
        const mensagem = ref("Olá, Vue.js!");
        const contador = ref(0);
        const ultimaTecla = ref("Nenhuma tecla pressionada");

        function atualizarMensagem(novaMensagem) {
          mensagem.value = novaMensagem;
        }

        function incrementar() {
          contador.value++;
          atualizarMensagem("Você clicou ou pressionou uma tecla para aumentar!");
        }

        function decrementar() {
          contador.value--;
          atualizarMensagem("Você reduziu o valor com clique ou teclado.");
        }

        function resetar() {
          contador.value = 0;
          atualizarMensagem("Contador reiniciado.");
        }

        function alternarEstado() {
          mensagem.value = contador.value % 2 === 0
            ? "Tecla Espaço ativada!"
            : "O espaço foi usado novamente!";
        }

        function atualizarUltimaTecla(event) {
          ultimaTecla.value = event.key || "Tecla desconhecida";
        }

        function pressionarTeclaGlobal(event) {
          const tecla = event.key;

          if (tecla === "ArrowUp" || tecla === "Enter") {
            incrementar();
          } else if (tecla === "ArrowDown" || tecla === "Backspace") {
            decrementar();
          } else if (tecla === " ") {
            alternarEstado();
          }

          atualizarUltimaTecla(event);
        }

        onMounted(() => {
          window.addEventListener("keydown", pressionarTeclaGlobal);
        });

        onBeforeUnmount(() => {
          window.removeEventListener("keydown", pressionarTeclaGlobal);
        });

        return {
          mensagem,
          contador,
          ultimaTecla,
          incrementar,
          decrementar,
          resetar,
          alternarEstado,
          atualizarUltimaTecla
        };
      }
    }).mount("#app");
  </script>
</body>
</html>
