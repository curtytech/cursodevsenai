<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>
    <script src="assets/js/supabase.js"></script>

    <script>

</head>

<body>
    <nav class="relative bg-gray-800">
        <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
            <div class="relative flex h-16 items-center justify-between">
                <div class="absolute inset-y-0 left-0 flex items-center sm:hidden">
                    <!-- Mobile menu button-->
                    <button type="button" command="--toggle" commandfor="mobile-menu"
                        class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-white/5 hover:text-white focus:outline-2 focus:-outline-offset-1 focus:outline-indigo-500">
                        <span class="absolute -inset-0.5"></span>
                        <span class="sr-only">Open main menu</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon"
                            aria-hidden="true" class="size-6 in-aria-expanded:hidden">
                            <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon"
                            aria-hidden="true" class="size-6 not-in-aria-expanded:hidden">
                            <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
                <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
                    <div class="flex shrink-0 items-center">

                <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">

                        Login

                    <!-- Profile dropdown -->

        <el-disclosure id="mobile-menu" hidden class="block sm:hidden">
            <div class="space-y-1 px-2 pt-2 pb-3">

            </div>
        </el-disclosure>

    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8  ">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm">
            <div class="flex justify-center">
                <i class=" text-4xl ph-bold ph-list-checks"></i>
            </div>

            <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">Crie sua conta
            </h2>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
            <div class="space-y-6">

                <div>
                    <label for="nome" class="block text-sm/6 font-medium text-gray-900">Nome</label>
                    <div class="mt-2">
                        <input id="nome" type="nome" name="nome" required autocomplete="nome"
                            class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm/6 font-medium text-gray-900">Email</label>
                    <div class="mt-2">
                        <input id="email" type="email" name="email" required autocomplete="email"
                            class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between">
                        <label for="password" class="block text-sm/6 font-medium text-gray-900">Senha</label>
                    </div>
                    <div class="mt-2">
                        <input id="password" type="password" name="password" required autocomplete="current-password"
                            class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
                    </div>
                </div>

                <div>
                    <button onclick="createUser()"
                        class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Enviar
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>

        async function createUser() {
            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            // const hashedPassword = bcrypt.hashSync(password, 10);

            const bcrypt = dcodeIO.bcrypt;
            const saltRounds = 10;

            if (!nome || !email || !password) {
                Swal.fire({
                    position: "top-center",
                    icon: "error",
                    title: "Preencha todos os campos!",
                    showConfirmButton: false,
                    timer: 1500
                });
                return;
            }

            console.log("Nome:", nome);
            console.log("Email:", email);
            console.log("Senha:", password);

            // Asynchronously hash a password
            bcrypt.hash(password, saltRounds, async function (err, hash) {
                if (err) {
                    console.error("Hashing failed:", err);
                } else {
                    console.log("Hashed Password:", hash);

                    const { data, error } = await supabaseClient
                        .from('users')
                        .insert([
                            { name: nome, email: email, password: hash }
                        ])

                    if (error) {
                        console.error('Erro ao criar usuário:', error)

                        Swal.fire({
                            position: "top-center",
                            icon: "error",
                            title: "Erro ao criar usuário!",
                            showConfirmButton: false,
                            timer: 1500
                        });
                    } else {
                        console.log('Usuário criado com sucesso:', data)

                        Swal.fire({
                            position: "top-center",
                            icon: "success",
                            title: "Usuário criado com sucesso!",
                            showConfirmButton: false,
                            timer: 1500
                        });

                        setTimeout(() => {
                            window.location.replace("login.html");
                        }, 1500);

                    }

                    event.preventDefault();

                    window.location.replace("login.html");

                   
                }
            });


            // return







            // document.getElementById("myForm").submit();

        }
        // console.log(SUPABASE_URL)
    </script>
</body>

</html>
