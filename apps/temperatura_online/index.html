<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados do Firestore</title>
</head>

<body>
    <h1>Dados da colecao temp</h1>
    <form id="form-temperatura">
        <label for="temperatura">Temperatura:</label>
        <input id="temperatura" name="temperatura" type="number" step="any" required>
        <button type="submit">Salvar temperatura</button>
    </form>
    <p id="mensagem" role="status"></p>

    <script type="module">
        import {initializeApp} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            getDocs,
            addDoc,
            serverTimestamp,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBqtx4CJLJJD7KT0eyTpT50gk7E-ssSRmQ",
            authDomain: "senai-2814a.firebaseapp.com",
            projectId: "senai-2814a",
            storageBucket: "senai-2814a.firebasestorage.app",
            messagingSenderId: "895820254331",
            appId: "1:895820254331:web:0ccc5edd8880f90f07a6de"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.querySelector("#form-temperatura");
        const mensagem = document.querySelector("#mensagem");

        form.addEventListener("submit", async event => {
            event.preventDefault();
            const temperatura = Number(form.elements.temperatura.value);

            if (!Number.isFinite(temperatura)) {
                mensagem.textContent = "Informe uma temperatura valida.";
                return;
            }

            try {
                const documento = await addDoc(collection(db, "temp"), {
                    created_at: serverTimestamp(),
                    temperatura,
                    umidade: 44
                });

                console.log("Temperatura salva:", {id: documento.id, temperatura, created_at: new Date(), umidade: 44});
                mensagem.textContent = "Temperatura salva com sucesso.";
                form.reset();
            } catch (error) {
                console.error("Nao foi possivel salvar a temperatura:", error);
                mensagem.textContent = "Erro ao salvar. Verifique as permissoes do Firestore.";
            }
        });

        const realtime = onSnapshot(
            collection(db, 'temp'),
            (snapshot) => {
                snapshot.forEach(doc => console.log('Realtime', doc.data()));
            },
            (erro) => console.error(erro)
        );

        try {
            const snapshot = await getDocs(collection(db, "temp"));
            const dados = snapshot.docs.map(documento => ({
                id: documento.id,
                ...documento.data()
            }));

            // console.log("Dados da colecao temp:", dados);
        } catch (error) {
            console.error("Nao foi possivel carregar os dados:", error);
        }
    </script>
</body>

</html>
